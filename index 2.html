function authScr(msg=''){A.innerHTML=head('')+`<main><div class=c><div class=lgo style="width:76px;height:76px;margin:0 auto 14px;border-radius:24px">${ic('chat',40)}</div><h2>سوالف</h2><p style="color:var(--mu)">سجّل دخولك بضغطة وحدة</p><button class="b w" id=gg style="background:#fff;color:#1f1f1f;box-shadow:var(--sh)">${GSVG} المتابعة بحساب Google</button><button class="b w" id=fb style="background:#1877f2;box-shadow:var(--sh)">${FSVG} المتابعة بحساب Facebook</button><p id=er style="color:var(--rd)">${msg}</p><button class="b w" id=gs style="background:var(--card);color:var(--tx);box-shadow:var(--sh)">الدخول كزائر</button></div></main>`;
const oa=p=>sb.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin+location.pathname}});
$('#gg').onclick=()=>oa('google');$('#fb').onclick=()=>oa('facebook');
$('#gs').onclick=async()=>{const{error}=await sb.auth.signInAnonymously();error?authScr('الدخول كزائر غير متاح حاليًا'):boot()}}
function setup(){let a='';A.innerHTML=head('')+`<main><div class=c><div class=lgo style="width:76px;height:76px;margin:0 auto 14px;border-radius:24px">${ic('chat',40)}</div><h2>أهلاً بك في سوالف</h2><p style="color:var(--mu)">اكتب اسمك واختر صورتك</p>${isGuest?'':'<label class="b p" style="display:inline-block">اختر صورة<input type=file id=sp accept="image/*" hidden></label>'}<p><input id=sn placeholder="اسمك في التطبيق" maxlength=30></p><button class=b id=go>ابدأ</button></div></main>`;
if($('#sp'))$('#sp').onchange=async e=>{const r=await crop(e.target.files[0]);if(r){a=r;e.target.parentNode.firstChild.textContent='تم اختيار الصورة ✓'}};
$('#go').onclick=async()=>{const n=$('#sn').value.trim();if(!n)return;const{error}=await sb.from('profiles').insert({id:me,name:n,avatar:a||null,is_guest:isGuest,color:['#ff7a1a','#7c3aed','#e11d48'][Math.floor(Math.random()*3)]});if(error){alert('تعذر إنشاء الملف: '+error.message);return}await loadP();su=0;render()}}
function render(){
if(chat||!ready)return;
if(isBanned()){A.innerHTML=head('')+`<main>${es('shield','تم حظرك من سوالف','لا يمكنك استخدام التطبيق')}<button class="b d w" data-a=out>تسجيل الخروج</button></main>`;return}
if(!P[me]){if(!su){su=1;setup()}return}
if(document.activeElement&&document.activeElement.tagName=='INPUT'&&$('#res')){res();return}
const inc=R.filter(r=>r.t==me&&r.s=='p'),fr=R.filter(r=>r.s=='a'&&(r.f==me||r.t==me)).map(r=>r.f==me?r.t:r.f).filter(o=>P[o]);
let h='';
if(tab=='p'){
h+=inc.length?`<h3>طلبات الصداقة (${inc.length})</h3>`+inc.map(r=>`<div class=row>${av(r.f)}<div class=n><b>${esc((P[r.f]||{}).n)}</b></div><button class=b data-a=acc data-i="${esc(r.id)}">قبول</button><button class="b d" data-a=del data-i="${esc(r.id)}">رفض</button></div>`).join(''):'';
const out=R.filter(r=>r.f==me&&r.s=='p'&&P[r.t]);h+=out.length?`<h3>طلبات أرسلتها (${out.length})</h3>`+out.map(r=>`<div class=row data-a=pr data-i="${esc(r.t)}">${av(r.t)}<div class=n><b>${esc(P[r.t].n)}</b><small>بانتظار الرد</small></div><button class="b d" data-a=del data-i="${esc(r.id)}">إلغاء</button></div>`).join(''):'';
const L=fr.map(o=>({o,...info(o)})).sort((a,b)=>b.t-a.t);
h+=L.map(c=>`<div class=row data-a=dm data-i="${esc(c.o)}">${av(c.o)}<div class=n><b>${esc(P[c.o].n)}</b><small>${esc(c.l||'ابدأ المحادثة')}</small></div>${c.t?`<small>${hm(c.t)}</small>`:''}${c.n?`<span class=bd>${c.n}</span>`:''}</div>`).join('')||es('chat','لا توجد محادثات بعد','أضف أصدقاء من تبويب المتصلون وابدأ السوالف')}
if(tab=='o'){h+=`<input id=q placeholder="ابحث باسم المستخدم" value="${esc(q)}"><h3 id=cnt></h3><div id=res></div>`}
if(tab=='r'){h+=`<div class=rg>${G.map(g=>{const p=g.name.split(' '),e=p.shift();return `<div class=rc data-a=go data-i="${esc(g.id)}"><span class=rf>${esc(e)}</span><b>${esc(p.join(' '))}</b><small>ادخل الغرفة</small></div>`}).join('')}</div>`}
if(tab=='a'&&adm){h+=`<h3>البلاغات (${RP.length})</h3>`+RP.map(r=>`<div class=row data-a=sh data-i="${esc(r.reported)}">${av(r.reported)}<div class=n><b>${esc((P[r.reported]||{}).n)}</b><small>${esc(r.reason||'')} · من ${esc((P[r.reporter]||{}).n)}</small></div><button class="b d" data-a=rd data-i="${r.id}">${ic('x',14)}</button></div>`).join('')+`<input id=q placeholder="ابحث عن مستخدم" value="${esc(q)}"><h3 id=cnt></h3><div id=res></div>`}
if(tab=='m'){const p=P[me];h+=`<div class=pf><div class=cv></div><div class=pa>${av(me,104)}${isGuest?'':`<label class=cm>${ic('cam',18)}<input type=file id=ph accept="image/*" hidden></label>`}</div><div class=pc>${isGuest?`<p style="color:var(--mu);font-size:13px">أنت داخل كزائر ولا يمكنك وضع صورة. اربط حسابك لحفظ بياناتك وإضافة صورتك:</p><button class="b w" data-a=lg style="background:#fff;color:#1f1f1f;box-shadow:var(--sh)">${GSVG} ربط حساب Google</button><button class="b w" data-a=lf style="background:#1877f2">${FSVG} ربط حساب Facebook</button>`:''}<label>الاسم</label><input id=nm value="${esc(p.n)}" maxlength=30><label>النبذة</label><input id=bi value="${esc(p.b)}" placeholder="اكتب نبذة قصيرة" maxlength=60><h3>الخصوصية</h3><label class=sw><input type=checkbox id=tdm ${p.dm===false?'':'checked'}><span>السماح بالرسائل الخاصة</span></label><label class=sw><input type=checkbox id=trq ${p.rq===false?'':'checked'}><span>السماح بطلبات الصداقة</span></label><button class="b w" data-a=sv>${ic('ck',18)} حفظ التغييرات</button><button class="b p w" data-a=th>${ic('moon',18)} تبديل الوضع الليلي</button><button class="b d w" data-a=out>تسجيل الخروج</button></div></div>`}
const T=[['r','globe','الغرف'],['o','users','المتصلون'],['p','chat','الخاص'],['m','user','ملفي']];if(adm)T.push(['a','shield','الإدارة']);
A.innerHTML=head('')+`<main>${h}</main><nav>${T.map(t=>`<button class="${tab==t[0]?'on':''}" data-a=tab data-i=${t[0]}>${ic(t[1],24)}<span>${t[2]}</span>${t[0]=='p'&&inc.length?`<b class=nb>${inc.length}</b>`:''}</button>`).join('')}</nav>`;
if(tab=='o'||tab=='a')res();
}
function res(){if(tab=='a')return resA();const el=$('#res');if(!el)return;const s=q.trim(),L=Object.keys(P).filter(i=>i!=me&&(P[i].n||'').includes(s)).sort((a,b)=>on(b)-on(a));
$('#cnt').textContent=L.filter(on).length+' متصل';
el.innerHTML=L.map(i=>{const r=rel(i),f=r&&r.s=='a';return `<div class=row data-a=${f?'dm':'pr'} data-i="${esc(i)}">${av(i)}<div class=n><b>${esc(P[i].n)}${P[i].g?' · زائر':''}</b><small>${esc(P[i].b)}</small></div>`+(f?`<span style="color:var(--or)">${ic('chat',22)}</span>`:!r?`<button class=b data-a=rq data-i="${esc(i)}">${ic('plus',16)} إضافة</button>`:`<small>${r.f==me?'تم الإرسال':'بانتظار ردك'}</small>`)+`</div>`}).join('')||es('users','لا نتائج')}
let tch=null,ty=0,tyN='',tsent=0;
const stat=()=>{const e=$('#st');if(!e||!chat)return;e.textContent=Date.now()<ty?(chat.o?'يكتب الآن…':tyN+' يكتب…'):chat.o?(on(chat.o)?'متصل الآن':'غير متصل'):'غرفة عامة'};
function tyOpen(n){tyClose();tch=sb.channel(n);tch.on('broadcast',{event:'t'},p=>{if(p.payload.u==me)return;ty=Date.now()+3000;tyN=(P[p.payload.u]||{}).n||'';stat();setTimeout(stat,3100)}).subscribe()}
function tyClose(){if(tch){sb.removeChannel(tch);tch=null}ty=0}
function shell(title,o,fl){
A.innerHTML=head(`${o?av(o,38):`<span class="ri pub" style="width:38px;height:38px;font-size:20px">${esc(fl||'')}</span>`}<div class=t><b>${esc(title)}</b><small id=st></small></div>${o?`<button class=i data-a=call>${ic('phone',20)}</button><button class=i data-a=blk>${ic('ban',20)}</button><button class=i data-a=rep>${ic('flag',20)}</button>`:''}`,1)+`<div id=ms></div><footer><textarea id=tx rows=1 placeholder="اكتب رسالة"></textarea><button class=sn data-a=snd>${ic('send',20)}</button></footer>`;
clearInterval(tm);tm=setInterval(stat,5000);stat()}
function draw(){const el=$('#ms');if(!el||!chat)return;const dm=!!chat.o,L=(dm?M.filter(m=>m.sender==chat.o||m.receiver==chat.o):RM).filter(m=>m.sender==me||!BL.has(m.sender));let last='';
el.innerHTML=L.map(m=>{const mine=m.sender==me,day=dl(m.created_at),sep=day!=last?`<div class=dt>${day}</div>`:'';last=day;
return sep+`<div class="mr ${mine?'me':''}">${av(m.sender,32,1)}<div class="m ${mine?'me':''}">${!dm&&!mine?`<small>${esc((P[m.sender]||{}).n)}</small>`:''}${esc(m.body)}<i>${adm&&!dm?`<s data-a=dl data-i="${m.id}" style="color:var(--rd);cursor:pointer">${ic('x',14)}</s>`:''}${hm(m.created_at)}${dm&&mine?` <s class="${m.read_at?'rd':''}">${ic(m.read_at?'dc':'ck',15)}</s>`:''}</i></div></div>`}).join('');el.scrollTop=1e9}
function markRead(){const o=chat&&chat.o;if(!o||!M.some(m=>m.sender==o&&m.receiver==me&&!m.read_at))return;const t=new Date().toISOString();M.forEach(m=>{if(m.sender==o&&m.receiver==me&&!m.read_at)m.read_at=t});sb.from('messages').update({read_at:t}).eq('sender',o).eq('receiver',me).is('read_at',null).then(()=>{})}
function openDM(o){chat={o};shell(P[o].n,o);tyOpen('ty-'+pair(o));markRead();draw()}
async function openRoom(g){chat={room:g.id};const pr=g.name.split(' ');shell(pr.slice(1).join(' '),0,pr[0]);tyOpen('ty-'+g.id);RM=[];draw();const{data}=await sb.from('messages').select('*').eq('room_id',g.id).order('created_at').limit(300);RM=data||[];draw()}
function repSheet(u){const w=document.createElement('div');w.className='ov';const R2=['إزعاج أو رسائل مسيئة','ألفاظ سيئة','انتحال شخصية','احتيال','أخرى'];
w.innerHTML=`<div class=bx><b>الإبلاغ عن ${esc(P[u].n)}</b>${R2.map((t,i)=>`<button class="b d w" data-s=${i}>${t}</button>`).join('')}<button class="b p w" data-s=x>إلغاء</button></div>`;document.body.appendChild(w);
w.onclick=async e=>{const a=e.target.dataset.s;if(a==null)return;w.remove();if(a=='x')return;const{error}=await sb.from('reports').insert({reporter:me,reported:u,reason:R2[a]});alert(error?'تعذر إرسال البلاغ':'تم إرسال البلاغ للإدارة')}}
async function send(){const i=$('#tx'),x=i.value.trim();if(!x)return;if(chat.o&&BL.has(chat.o)){alert('لقد حظرت هذا المستخدم. ارفع الحظر أولًا');return}const mu=myMute();if(mu){alert('أنت مكتوم'+(mu.until?' حتى '+new Date(mu.until).toLocaleString('ar'):' بشكل دائم'));return}i.value='';const row=chat.o?{sender:me,receiver:chat.o,body:x}:{sender:me,room_id:chat.room,body:x};const{data,error}=await sb.from('messages').insert(row).select().single();if(error){alert('تعذر الإرسال');i.value=x;return}addM(data);draw()}
A.addEventListener('click',async e=>{const pu=e.target.closest('[data-u]');if(pu){profileOf(pu.dataset.u);return}const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i;
if(a=='th')theme();
else if(a=='tab'){tab=i;render()}
else if(a=='back'){clearInterval(tm);tyClose();chat=null;render()}
else if(a=='rq'){await sb.from('friendships').insert({requester:me,addressee:i});await loadR();render()}
else if(a=='acc'){await sb.from('friendships').update({status:'accepted'}).eq('id',i);await loadR();render()}
else if(a=='del'){await sb.from('friendships').delete().eq('id',i);await loadR();render()}
else if(a=='dm')openDM(i);
else if(a=='mk'){const n=$('#rn').value.trim();if(!n)return;const{data}=await sb.from('rooms').insert({name:n,created_by:me}).select().single();if(data)await sb.from('room_members').insert({room_id:data.id,user_id:me});await loadG();render()}
else if(a=='jn'){await sb.from('room_members').insert({room_id:i,user_id:me});await loadG();render()}
else if(a=='go')openRoom(G.find(x=>x.id==i));
else if(a=='sv'){await sb.from('profiles').update({name:$('#nm').value.trim()||P[me].n,bio:$('#bi').value.trim()}).eq('id',me);await loadP();render()}
else if(a=='out'){await sb.auth.signOut();location.reload()}
else if(a=='pf'){tab='m';render()}
else if(a=='pr')profileOf(i);
else if(a=='call')alert('الاتصال الصوتي قيد التجهيز وسيُضاف في تحديث قادم')
else if(a=='blk'&&chat&&chat.o){const o=chat.o;if(BL.has(o)){await sb.from('blocks').delete().eq('blocker',me).eq('blocked',o);BL.delete(o);alert('تم رفع الحظر')}else if(confirm('حظر '+P[o].n+'؟ لن تصلك رسائله ولن يستطيع مراسلتك.')){await sb.from('blocks').insert({blocker:me,blocked:o});BL.add(o)}draw()}
else if(a=='rep'&&chat&&chat.o)repSheet(chat.o);
else if(a=='lg'||a=='lf')sb.auth.linkIdentity({provider:a=='lg'?'google':'facebook',options:{redirectTo:location.origin+location.pathname}});
else if(a=='rd'){await sb.from('reports').delete().eq('id',i);await loadAdm();render()}
else if(a=='sh')sheet(i);
else if(a=='dl'){await sb.from('messages').delete().eq('id',i);RM=RM.filter(m=>m.id!=i);draw()}
else if(a=='snd')send()});
A.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;res()}if(e.target.id=='tx'&&tch&&Date.now()-tsent>2000){tsent=Date.now();tch.send({type:'broadcast',event:'t',payload:{u:me}})}});
A.addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.shiftKey&&e.target.id=='tx'&&matchMedia('(hover:hover)').matches){e.preventDefault();send()}});
A.addEventListener('change',async e=>{if(e.target.id=='ph'){const r=await crop(e.target.files[0]);if(r){await sb.from('profiles').update({avatar:r}).eq('id',me);await loadP();render()}}});
function profileOf(u){if(u==me){tab='m';render();return}const p=P[u];if(!p)return;const r=rel(u),f=r&&r.s=='a';let act='';
if(f)act=p.dm===false?'<p style="color:var(--mu)">الرسائل الخاصة مغلقة عند هذا المستخدم</p>':`<button class="b w" data-p=msg>${ic('chat',18)} مراسلة</button>`;
else if(!r)act=p.rq===false?'<p style="color:var(--mu)">لا يستقبل طلبات الصداقة</p>':`<button class="b w" data-p=add>${ic('plus',18)} إضافة صديق</button>`;
else if(r.f==me)act='<button class="b p w" data-p=cancel>تم الإرسال · إلغاء الطلب</button>';
else act='<button class="b w" data-p=acc>قبول الطلب</button><button class="b d w" data-p=rej>رفض</button>';
const w=document.createElement('div');w.className='ov';
w.innerHTML=`<div class=bx style="padding:0;overflow:hidden"><div class=cv style="height:80px"></div><div class=pa style="margin-top:-44px;width:88px">${av(u,88,1)}</div><div style="padding:8px 18px 18px"><b style="font-size:18px">${esc(p.n)}${p.g?' · زائر':''}</b><p style="color:var(--mu);margin:4px 0">${esc(p.b)||'—'}</p><small style="color:var(--mu)">${on(u)?'متصل الآن':'غير متصل'}</small>${act}${adm?'<button class="b p w" data-p=adm>إدارة المستخدم</button>':''}<button class="b w" data-p=x style="background:var(--ln);color:var(--tx);box-shadow:none">إغلاق</button></div></div>`;
document.body.appendChild(w);
w.onclick=async e=>{const a=e.target.dataset.p;if(!a&&e.target!==w)return;w.remove();let er=null;
if(a=='add'){er=(await sb.from('friendships').insert({requester:me,addressee:u})).error;await loadR();if(er)alert('تعذر إرسال الطلب')}
else if(a=='cancel'||a=='rej'){await sb.from('friendships').delete().eq('id',r.id);await loadR()}
else if(a=='acc'){await sb.from('friendships').update({status:'accepted'}).eq('id',r.id);await loadR()}
else if(a=='msg'){openDM(u);return}
else if(a=='adm'){sheet(u);return}
if(!chat)render()}}
A.addEventListener('change',async e=>{if(e.target.id=='tdm'||e.target.id=='trq'){await sb.from('profiles').update({allow_dm:$('#tdm').checked,allow_req:$('#trq').checked}).eq('id',me);await loadP()}});
function live(){sb.channel('sw').on('postgres_changes',{event:'*',schema:'public'},async p=>{const t=p.table,m=p.new;if(p.eventType=='DELETE'&&t=='messages'){RM=RM.filter(x=>x.id!=p.old.id);M=M.filter(x=>x.id!=p.old.id);chat?draw():render();return}
if(t=='messages'){if(p.eventType=='INSERT'){if(m.room_id){if(chat&&chat.room==m.room_id){addM(m);draw()}}else{addM(m);if(chat&&chat.o==m.sender)markRead();chat&&chat.o?draw():render()}}else if(p.eventType=='UPDATE'&&!m.room_id){const i=M.findIndex(x=>x.id==m.id);if(i>=0){M[i]=m;chat&&chat.o?draw():render()}}}
else if(t=='bans'||t=='mutes'){await loadAdm();if(isBanned())chat=null;render()}
else if(t=='friendships'){await loadR();render()}
else if(t=='rooms'||t=='room_members'){await loadG();render()}
else if(t=='profiles'&&m&&m.id){P[m.id]=mp(m);render()}}).subscribe()}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){authScr();return}me=session.user.id;isGuest=!!session.user.is_anonymous;await ld();await loadAdm();const U=session.user,md=U.user_metadata||{};if(!P[me]&&!U.is_anonymous){const n=(md.full_name||md.name||(U.email||'').split('@')[0]||'مستخدم').slice(0,30);await sb.from('profiles').insert({id:me,name:n,avatar:md.avatar_url||md.picture||null,color:['#ff7a1a','#7c3aed','#e11d48'][Math.floor(Math.random()*3)]});await loadP()}if(P[me]&&P[me].g&&!isGuest){await sb.from('profiles').update({is_guest:false,avatar:P[me].a||md.avatar_url||md.picture||null}).eq('id',me);await loadP()}ready=1;live();render();
setInterval(()=>{if(P[me])sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',me).then(()=>{})},30000)}
A.innerHTML='<div class=es>جارٍ التحميل…</div>';
boot();

</script>
