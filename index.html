<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<style>
:root{--bg:#f6f2ff;--card:#fff;--tx:#1f1633;--mu:#7a7090;--ln:#ece5f8;--me:linear-gradient(135deg,#ffe6d0,#ffd2ad);--ot:#fff;--wpc:#f1eafc;--or:#ff7a1a;--pu:#7c3aed;--rd:#e11d48;--g1:linear-gradient(135deg,#ffa04a,#ff5a1f);--g2:linear-gradient(135deg,#9b6cf8,#6d28d9);--g3:linear-gradient(135deg,#fb5a78,#e11d48);--sh:0 2px 12px #5b3ea61f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110c1e;--card:#1c1530;--tx:#f1ecff;--mu:#a398c0;--ln:#2d2447;--me:linear-gradient(135deg,#8a4a1b,#6b3416);--ot:#2a2045;--wpc:#150f26;--sh:0 2px 12px #0005;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#110c1e;--card:#1c1530;--tx:#f1ecff;--mu:#a398c0;--ln:#2d2447;--me:linear-gradient(135deg,#8a4a1b,#6b3416);--ot:#2a2045;--wpc:#150f26;--sh:0 2px 12px #0005;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;font-size:16px}
svg{flex:none}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:auto;background:var(--bg);box-shadow:0 0 40px #0002}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);box-shadow:var(--sh);z-index:2}
header h1{flex:1;margin:0;font-size:22px;font-weight:800;min-width:0;background:linear-gradient(90deg,#ff7a1a,#e11d48 55%,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
header .t{flex:1;min-width:0;line-height:1.35}header .t b{display:block;color:var(--tx)}header .t small{color:var(--mu);font-size:12px}
.lgo{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#ff9a3c,#e11d48 55%,#7c3aed);color:#fff;box-shadow:0 4px 12px #e11d4833;flex:none}
main{flex:1;overflow-y:auto;padding:14px}
nav{display:flex;background:var(--card);box-shadow:0 -2px 12px #5b3ea61a}
nav button{position:relative;flex:1;border:0;background:none;color:var(--mu);padding:9px 4px 8px;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--or);font-weight:700}
nav button.on::after{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 4px 4px;background:var(--g1)}
button.b{border:0;border-radius:12px;padding:9px 15px;color:#fff;background:var(--g1);font:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 10px #ff5a1f33;cursor:pointer}
button.p{background:var(--g2);box-shadow:0 3px 10px #6d28d933}button.d{background:var(--g3);box-shadow:0 3px 10px #e11d4833}
button.w{width:100%;justify-content:center;margin-top:12px;padding:13px}
button.b:active,.sn:active{transform:scale(.96)}
button.i{background:none;border:0;color:var(--tx);padding:6px;display:flex;border-radius:50%}
input[type=text],input[type=email],input[type=password],input:not([type]){width:100%;padding:12px 14px;border:1.5px solid var(--ln);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;outline:0}
input:focus{border-color:var(--pu)}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--card);border-radius:16px;margin-bottom:9px;box-shadow:var(--sh)}
.row[data-a=dm],.row[data-a=go]{cursor:pointer}.row[data-a=dm]:active{transform:scale(.985)}
.row .n{flex:1;min-width:0}.row .n b{display:block}.row small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{background:var(--g1);color:#fff;border-radius:12px;min-width:22px;padding:1px 7px;font-size:12px;text-align:center;font-weight:700}
.on1{position:relative;display:inline-flex}.on1::after{content:"";position:absolute;bottom:0;inset-inline-start:0;width:13px;height:13px;border-radius:50%;background:#22c55e;border:2.5px solid var(--card)}
.av{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.ri{width:46px;height:46px;border-radius:50%;background:var(--g2);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}.ri.pub{background:var(--g1)}
h3{margin:16px 4px 10px;color:var(--pu);font-size:14px;font-weight:700}
.c{text-align:center;padding:24px 16px}.c .av{margin:10px auto;display:flex}
.es{text-align:center;color:var(--mu);padding:46px 20px}.es svg{color:var(--pu);opacity:.45;margin-bottom:8px}.es b{display:block;color:var(--tx);margin-bottom:4px}
.pf{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--sh)}
.cv{height:112px;background:linear-gradient(120deg,#ff7a1a,#e11d48 55%,#7c3aed)}
.pa{position:relative;width:108px;margin:-54px auto 0}.pa .av,.pa img{border:4px solid var(--card)}
.cm{position:absolute;bottom:2px;inset-inline-end:-2px;width:36px;height:36px;border-radius:50%;background:var(--g2);color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid var(--card);cursor:pointer}
.pc{padding:8px 18px 20px}.pc label{display:block;margin:14px 4px 6px;color:var(--mu);font-size:13px}
#ms{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:radial-gradient(circle at 15% 8%,#ff7a1a18,transparent 42%),radial-gradient(circle at 85% 92%,#7c3aed22,transparent 46%),var(--wpc)}
.m{max-width:82%;padding:7px 11px 5px;border-radius:18px;background:var(--ot);align-self:flex-end;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 2px #0002;border-end-end-radius:5px}
.m.me{background:var(--me);align-self:flex-start;border-end-end-radius:18px;border-end-start-radius:5px}
.m small{display:block;color:var(--pu);font-size:12px;font-weight:700}
.m i{font-style:normal;float:left;margin:5px 8px 0 0;color:var(--mu);font-size:11px;display:inline-flex;gap:3px;align-items:center}
.m i s{text-decoration:none;display:inline-flex}.m i s.rd{color:#3b9cf5}
.dt{align-self:center;background:#0000002e;color:#fff;border-radius:12px;padding:3px 12px;font-size:12px;margin:9px 0}
footer{display:flex;gap:8px;padding:9px;background:var(--card);align-items:flex-end;box-shadow:0 -2px 12px #5b3ea614}
footer textarea{flex:1;max-height:110px;border:1.5px solid var(--ln);border-radius:22px;padding:10px 16px;background:var(--bg);color:var(--tx);font:inherit;resize:none;outline:0}
.sn{width:44px;height:44px;border-radius:50%;border:0;background:var(--g1);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px #ff5a1f44;flex:none}.sn svg{transform:scaleX(-1)}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9}
.bx{background:var(--card);padding:18px;border-radius:22px;text-align:center;width:310px}
.bx canvas{border-radius:50%;touch-action:none;background:#000;width:260px;height:260px;box-shadow:0 0 0 4px var(--or)}
.bx input{width:100%;margin:14px 0;accent-color:var(--or)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I={globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',chat:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 21l1.9-5.1A8.4 8.4 0 1 1 21 11.5z"/>',user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',back:'<path d="M5 12h14M12 5l7 7-7 7"/>',send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',ck:'<path d="M20 6 9 17l-5-5"/>',dc:'<path d="M18 6 7 17l-5-5M22 10l-7.5 7.5L13 16"/>',cam:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',plus:'<path d="M12 5v14M5 12h14"/>',hash:'<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>'};
const ic=(n,z=22)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const es=(n,t,x='')=>`<div class=es>${ic(n,46)}<b>${t}</b><small>${x}</small></div>`;
const SU='https://fnhgbnnucbarlayfkudi.supabase.co',SK='sb_publishable_rV93xFi_NZ5czfaP2sK_7Q_jQ6A_Cyx';
const sb=supabase.createClient(SU,SK);
let me,P={},R=[],G=[],M=[],RM=[],tab='p',chat=null,q='',su=0,ready=0,tm=null;
const mp=r=>({n:r.name,b:r.bio||'',a:r.avatar,c:r.color,u:Date.parse(r.last_seen)});
try{const t=localStorage.getItem('th');if(t)document.documentElement.dataset.theme=t}catch(e){}
function theme(){const d=document.documentElement,n=getComputedStyle(d).colorScheme=='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('th',n)}catch(e){}document.querySelectorAll('header [data-a=th]').forEach(b=>b.innerHTML=ic(n=='dark'?'sun':'moon'))}
const on=o=>P[o]&&P[o].u&&Date.now()-P[o].u<70000;
const hm=t=>new Date(t).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
const dl=t=>new Date(t).toLocaleDateString('ar',{day:'numeric',month:'long'});
function av(id,z=46){const p=P[id]||{},h=p.a?`<img class=av width=${z} height=${z} src="${esc(p.a)}">`:`<span class=av style="width:${z}px;height:${z}px;background:linear-gradient(135deg,#fff4,#0003) ${esc(p.c||'#7c3aed')}">${esc((p.n||'؟')[0])}</span>`;return on(id)?`<span class=on1>${h}</span>`:h}
function crop(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
const S=260,b=S/Math.min(im.width,im.height);let z=1,ox=(S-im.width*b)/2,oy=(S-im.height*b)/2,dr=null;
const w=document.createElement('div');w.className='ov';w.innerHTML=`<div class=bx><b>حرّك الصورة وكبّرها أو صغّرها</b><br><br><canvas width=${S} height=${S}></canvas><input type=range min=1 max=4 step=.01 value=1><button class="b d" id=cx>إلغاء</button> <button class=b id=cs>تم</button></div>`;
document.body.appendChild(w);const c=w.querySelector('canvas'),x=c.getContext('2d'),sl=w.querySelector('input');
const draw=()=>{const s=b*z,W=im.width*s,H=im.height*s;ox=Math.min(0,Math.max(S-W,ox));oy=Math.min(0,Math.max(S-H,oy));x.clearRect(0,0,S,S);x.drawImage(im,ox,oy,W,H)};
const zoom=n=>{n=Math.min(4,Math.max(1,n));const cx=(S/2-ox)/(b*z),cy=(S/2-oy)/(b*z);z=n;ox=S/2-cx*b*z;oy=S/2-cy*b*z;sl.value=z;draw()};
sl.oninput=()=>zoom(+sl.value);c.onwheel=e=>{e.preventDefault();zoom(z-e.deltaY/500)};
c.onpointerdown=e=>{dr=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointerup=()=>dr=null;
c.onpointermove=e=>{if(!dr)return;ox+=e.clientX-dr[0];oy+=e.clientY-dr[1];dr=[e.clientX,e.clientY];draw()};
w.querySelector('#cx').onclick=()=>{w.remove();ok(null)};
w.querySelector('#cs').onclick=()=>{const o=document.createElement('canvas');o.width=o.height=160;o.getContext('2d').drawImage(c,0,0,160,160);w.remove();ok(o.toDataURL('image/jpeg',.8))};
draw()};im.src=r.result};r.readAsDataURL(file)})}
const rel=o=>R.find(r=>(r.f==me&&r.t==o)||(r.f==o&&r.t==me));
const info=o=>{const L=M.filter(m=>m.sender==o||m.receiver==o),l=L[L.length-1]||{};return{l:l.body,t:l.created_at?Date.parse(l.created_at):0,n:L.filter(m=>m.receiver==me&&!m.read_at).length}};
const head=(t,back)=>`<header>${back?`<button class=i data-a=back>${ic('back',24)}</button>${t}`:`<span class=lgo>${ic('chat',20)}</span><h1>سوالف</h1>`}<button class=i data-a=th>${ic(getComputedStyle(document.documentElement).colorScheme=='dark'?'sun':'moon')}</button></header>`;
async function loadP(){const{data}=await sb.from('profiles').select('*').limit(1000);P={};(data||[]).forEach(r=>P[r.id]=mp(r))}
async function loadR(){const{data}=await sb.from('friendships').select('*');R=(data||[]).map(r=>({id:r.id,f:r.requester,t:r.addressee,s:r.status=='accepted'?'a':'p'}))}
async function loadG(){const[a,b]=await Promise.all([sb.from('rooms').select('*'),sb.from('room_members').select('*')]);G=(a.data||[]).map(r=>({id:r.id,name:r.name,pub:r.is_public,mem:(b.data||[]).filter(m=>m.room_id==r.id).map(m=>m.user_id)})).sort((x,y)=>y.pub-x.pub)}
async function loadM(){const{data}=await sb.from('messages').select('*').is('room_id',null).order('created_at',{ascending:false}).limit(600);M=(data||[]).reverse()}
const ld=()=>Promise.all([loadP(),loadR(),loadG(),loadM()]);
const addM=m=>{const a=m.room_id?RM:M;if(!a.some(x=>x.id==m.id))a.push(m)};
function authScr(msg=''){A.innerHTML=head('')+`<main><div class=c><div class=lgo style="width:76px;height:76px;margin:0 auto 14px;border-radius:24px">${ic('chat',40)}</div><h2>سوالف</h2><p style="color:var(--mu)">سجّل دخولك أو أنشئ حسابًا جديدًا</p><p><input id=em type=email dir=ltr placeholder="البريد الإلكتروني" autocomplete=email></p><p><input id=pw type=password dir=ltr placeholder="كلمة السر (6 أحرف على الأقل)" autocomplete=current-password></p><p id=er style="color:var(--rd)">${msg}</p><button class="b w" id=li>تسجيل الدخول</button><button class="b p w" id=sg>إنشاء حساب جديد</button></div></main>`;
const v=()=>[$('#em').value.trim(),$('#pw').value];
$('#li').onclick=async()=>{const[e,p]=v();const{error}=await sb.auth.signInWithPassword({email:e,password:p});error?authScr('البريد أو كلمة السر غير صحيحة'):boot()};
$('#sg').onclick=async()=>{const[e,p]=v();if(!e||p.length<6){authScr('اكتب بريدًا صحيحًا وكلمة سر من 6 أحرف أو أكثر');return}const{data,error}=await sb.auth.signUp({email:e,password:p});if(error){authScr('تعذر إنشاء الحساب: '+error.message);return}data.session?boot():authScr('تم إرسال رسالة تأكيد إلى بريدك. أكّد ثم سجّل دخولك')}}
function setup(){let a='';A.innerHTML=head('')+`<main><div class=c><div class=lgo style="width:76px;height:76px;margin:0 auto 14px;border-radius:24px">${ic('chat',40)}</div><h2>أهلاً بك في سوالف</h2><p style="color:var(--mu)">اكتب اسمك واختر صورتك</p><label class="b p" style="display:inline-block">اختر صورة<input type=file id=sp accept="image/*" hidden></label><p><input id=sn placeholder="اسمك في التطبيق" maxlength=30></p><button class=b id=go>ابدأ</button></div></main>`;
$('#sp').onchange=async e=>{const r=await crop(e.target.files[0]);if(r){a=r;e.target.parentNode.firstChild.textContent='تم اختيار الصورة ✓'}};
$('#go').onclick=async()=>{const n=$('#sn').value.trim();if(!n)return;const{error}=await sb.from('profiles').insert({id:me,name:n,avatar:a||null,color:['#ff7a1a','#7c3aed','#e11d48'][Math.floor(Math.random()*3)]});if(error){alert('تعذر إنشاء الملف: '+error.message);return}await loadP();su=0;render()}}
function render(){
if(chat||!ready)return;
if(!P[me]){if(!su){su=1;setup()}return}
if(document.activeElement&&document.activeElement.tagName=='INPUT'&&$('#res')){res();return}
const inc=R.filter(r=>r.t==me&&r.s=='p'),fr=R.filter(r=>r.s=='a'&&(r.f==me||r.t==me)).map(r=>r.f==me?r.t:r.f).filter(o=>P[o]);
let h='';
if(tab=='p'){
h+=inc.length?`<h3>طلبات الصداقة (${inc.length})</h3>`+inc.map(r=>`<div class=row>${av(r.f)}<div class=n><b>${esc((P[r.f]||{}).n)}</b></div><button class=b data-a=acc data-i="${esc(r.id)}">قبول</button><button class="b d" data-a=del data-i="${esc(r.id)}">رفض</button></div>`).join(''):'';
const L=fr.map(o=>({o,...info(o)})).sort((a,b)=>b.t-a.t);
h+=L.map(c=>`<div class=row data-a=dm data-i="${esc(c.o)}">${av(c.o)}<div class=n><b>${esc(P[c.o].n)}</b><small>${esc(c.l||'ابدأ المحادثة')}</small></div>${c.t?`<small>${hm(c.t)}</small>`:''}${c.n?`<span class=bd>${c.n}</span>`:''}</div>`).join('')||es('chat','لا توجد محادثات بعد','أضف أصدقاء من تبويب المتصلون وابدأ السوالف')}
if(tab=='o'){h+=`<input id=q placeholder="ابحث باسم المستخدم" value="${esc(q)}"><h3 id=cnt></h3><div id=res></div>`}
if(tab=='r'){
h+=`<div class=row><input id=rn placeholder="اسم غرفة جديدة"><button class="b p" data-a=mk>${ic('plus',16)} إنشاء</button></div>`+G.map(g=>{const j=g.pub||g.mem.includes(me);return `<div class=row><span class="ri${g.pub?' pub':''}">${ic(g.pub?'globe':'hash',22)}</span><div class=n><b>${esc(g.name)}</b><small>${g.pub?'مفتوحة للجميع':g.mem.length+' عضو'}</small></div><button class="b ${j?'':'p'}" data-a=${j?'go':'jn'} data-i="${esc(g.id)}">${j?'فتح':'انضمام'}</button></div>`}).join('')}
if(tab=='m'){const p=P[me];h+=`<div class=pf><div class=cv></div><div class=pa>${av(me,104)}<label class=cm>${ic('cam',18)}<input type=file id=ph accept="image/*" hidden></label></div><div class=pc><label>الاسم</label><input id=nm value="${esc(p.n)}" maxlength=30><label>النبذة</label><input id=bi value="${esc(p.b)}" placeholder="اكتب نبذة قصيرة" maxlength=60><button class="b w" data-a=sv>${ic('ck',18)} حفظ التغييرات</button><button class="b p w" data-a=th>${ic('moon',18)} تبديل الوضع الليلي</button><button class="b d w" data-a=out>تسجيل الخروج</button></div></div>`}
const T=[['r','globe','الغرف'],['o','users','المتصلون'],['p','chat','الخاص'],['m','user','ملفي']];
A.innerHTML=head('')+`<main>${h}</main><nav>${T.map(t=>`<button class="${tab==t[0]?'on':''}" data-a=tab data-i=${t[0]}>${ic(t[1],24)}<span>${t[2]}</span></button>`).join('')}</nav>`;
if(tab=='o')res();
}
function res(){const el=$('#res');if(!el)return;const s=q.trim(),L=Object.keys(P).filter(i=>i!=me&&(P[i].n||'').includes(s)).sort((a,b)=>on(b)-on(a));
$('#cnt').textContent=L.filter(on).length+' متصل';
el.innerHTML=L.map(i=>{const r=rel(i),f=r&&r.s=='a';return `<div class=row ${f?`data-a=dm data-i="${esc(i)}"`:''}>${av(i)}<div class=n><b>${esc(P[i].n)}</b><small>${esc(P[i].b)}</small></div>`+(f?`<span style="color:var(--or)">${ic('chat',22)}</span>`:!r?`<button class=b data-a=rq data-i="${esc(i)}">${ic('plus',16)} إضافة</button>`:`<small>${r.f==me?'تم الإرسال':'بانتظار ردك'}</small>`)+`</div>`}).join('')||es('users','لا نتائج')}
function shell(title,o,sub){
A.innerHTML=head(`${o?av(o,38):`<span class="ri${sub=='pub'?' pub':''}" style="width:38px;height:38px">${ic(sub=='pub'?'globe':'hash',18)}</span>`}<div class=t><b>${esc(title)}</b><small id=st></small></div>`,1)+`<div id=ms></div><footer><textarea id=tx rows=1 placeholder="اكتب رسالة"></textarea><button class=sn data-a=snd>${ic('send',20)}</button></footer>`;
clearInterval(tm);const s=()=>{const e=$('#st');if(e)e.textContent=o?(on(o)?'متصل الآن':'غير متصل'):(sub=='pub'?'غرفة عامة':'غرفة جماعية')};s();tm=setInterval(s,5000)}
function draw(){const el=$('#ms');if(!el||!chat)return;const dm=!!chat.o,L=dm?M.filter(m=>m.sender==chat.o||m.receiver==chat.o):RM;let last='';
el.innerHTML=L.map(m=>{const mine=m.sender==me,day=dl(m.created_at),sep=day!=last?`<div class=dt>${day}</div>`:'';last=day;
return sep+`<div class="m ${mine?'me':''}">${!dm&&!mine?`<small>${esc((P[m.sender]||{}).n)}</small>`:''}${esc(m.body)}<i>${hm(m.created_at)}${dm&&mine?` <s class="${m.read_at?'rd':''}">${ic(m.read_at?'dc':'ck',15)}</s>`:''}</i></div>`}).join('');el.scrollTop=1e9}
function markRead(){const o=chat&&chat.o;if(!o||!M.some(m=>m.sender==o&&m.receiver==me&&!m.read_at))return;const t=new Date().toISOString();M.forEach(m=>{if(m.sender==o&&m.receiver==me&&!m.read_at)m.read_at=t});sb.from('messages').update({read_at:t}).eq('sender',o).eq('receiver',me).is('read_at',null).then(()=>{})}
function openDM(o){chat={o};shell(P[o].n,o);markRead();draw()}
async function openRoom(g){chat={room:g.id};shell(g.name,0,g.pub?'pub':'grp');RM=[];draw();const{data}=await sb.from('messages').select('*').eq('room_id',g.id).order('created_at').limit(300);RM=data||[];draw()}
async function send(){const i=$('#tx'),x=i.value.trim();if(!x)return;i.value='';const row=chat.o?{sender:me,receiver:chat.o,body:x}:{sender:me,room_id:chat.room,body:x};const{data,error}=await sb.from('messages').insert(row).select().single();if(error){alert('تعذر الإرسال');i.value=x;return}addM(data);draw()}
A.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i;
if(a=='th')theme();
else if(a=='tab'){tab=i;render()}
else if(a=='back'){clearInterval(tm);chat=null;render()}
else if(a=='rq'){await sb.from('friendships').insert({requester:me,addressee:i});await loadR();render()}
else if(a=='acc'){await sb.from('friendships').update({status:'accepted'}).eq('id',i);await loadR();render()}
else if(a=='del'){await sb.from('friendships').delete().eq('id',i);await loadR();render()}
else if(a=='dm')openDM(i);
else if(a=='mk'){const n=$('#rn').value.trim();if(!n)return;const{data}=await sb.from('rooms').insert({name:n,created_by:me}).select().single();if(data)await sb.from('room_members').insert({room_id:data.id,user_id:me});await loadG();render()}
else if(a=='jn'){await sb.from('room_members').insert({room_id:i,user_id:me});await loadG();render()}
else if(a=='go')openRoom(G.find(x=>x.id==i));
else if(a=='sv'){await sb.from('profiles').update({name:$('#nm').value.trim()||P[me].n,bio:$('#bi').value.trim()}).eq('id',me);await loadP();render()}
else if(a=='out'){await sb.auth.signOut();location.reload()}
else if(a=='snd')send()});
A.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;res()}});
A.addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.shiftKey&&e.target.id=='tx'&&matchMedia('(hover:hover)').matches){e.preventDefault();send()}});
A.addEventListener('change',async e=>{if(e.target.id=='ph'){const r=await crop(e.target.files[0]);if(r){await sb.from('profiles').update({avatar:r}).eq('id',me);await loadP();render()}}});
function live(){sb.channel('sw').on('postgres_changes',{event:'*',schema:'public'},async p=>{const t=p.table,m=p.new;
if(t=='messages'){if(p.eventType=='INSERT'){if(m.room_id){if(chat&&chat.room==m.room_id){addM(m);draw()}}else{addM(m);if(chat&&chat.o==m.sender)markRead();chat&&chat.o?draw():render()}}else if(p.eventType=='UPDATE'&&!m.room_id){const i=M.findIndex(x=>x.id==m.id);if(i>=0){M[i]=m;chat&&chat.o?draw():render()}}}
else if(t=='friendships'){await loadR();render()}
else if(t=='rooms'||t=='room_members'){await loadG();render()}
else if(t=='profiles'&&m&&m.id){P[m.id]=mp(m);render()}}).subscribe()}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){authScr();return}me=session.user.id;await ld();ready=1;live();render();
setInterval(()=>{if(P[me])sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',me).then(()=>{})},30000)}
A.innerHTML='<div class=es>جارٍ التحميل…</div>';
boot();

</script>
</body>
</html>
